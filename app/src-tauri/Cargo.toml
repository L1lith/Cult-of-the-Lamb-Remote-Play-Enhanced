[package]
name = "remote-play-enhanced"
version = "0.1.0"
description = "Desktop companion for the Remote Play Enhanced mod"
authors = ["L1lith"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "remote_play_enhanced_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpe-core = { path = "core" }

[features]
default = []
