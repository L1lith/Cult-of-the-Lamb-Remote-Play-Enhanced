name: build-mod

on:
  push:
    branches: [main]
    tags:
      - "mod-v*"
  pull_request:
    paths:
      - "mod/**"
      - "NuGet.config"
      - ".github/workflows/mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore mod/RemotePlayEnhanced.csproj

      - name: Build
        run: dotnet build mod/RemotePlayEnhanced.csproj -c Release --no-restore

      - name: Verify artifact
        run: |
          ls -la mod/bin/Release/
          test -f mod/bin/Release/RemotePlayEnhanced.dll

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePlayEnhanced
          path: mod/bin/Release/RemotePlayEnhanced.dll
          if-no-files-found: error

      - name: Package drop-in BepInEx zip
        run: |
          mkdir -p dist/package/BepInEx/plugins/RemotePlayEnhanced
          cp mod/bin/Release/RemotePlayEnhanced.dll dist/package/BepInEx/plugins/RemotePlayEnhanced/
          cp mod/README.md dist/package/BepInEx/plugins/RemotePlayEnhanced/README.md
          cd dist/package
          zip -r ../RemotePlayEnhanced.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePlayEnhanced-package
          path: dist/RemotePlayEnhanced.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mod-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RemotePlayEnhanced-package
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#mod-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/RemotePlayEnhanced.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/RemotePlayEnhanced.zip \
              --title "Remote Play Enhanced v${VERSION}" \
              --notes "BepInEx 5 plugin. Extract the zip into the Cult of the Lamb folder."
          fi
