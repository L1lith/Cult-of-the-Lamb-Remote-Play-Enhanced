name: build-mod

on:
  push:
    branches: [main]
    tags:
      - "mod-v*"
  pull_request:
    paths:
      - "mod/**"
      - "loader/**"
      - "NuGet.config"
      - ".github/workflows/mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore mod
        run: dotnet restore mod/RemotePlayEnhanced.csproj

      - name: Restore bootstrap
        run: dotnet restore mod/bootstrap/RemotePlayEnhanced.Bootstrap.csproj

      - name: Build mod
        run: dotnet build mod/RemotePlayEnhanced.csproj -c Release --no-restore

      - name: Build bootstrap
        run: dotnet build mod/bootstrap/RemotePlayEnhanced.Bootstrap.csproj -c Release --no-restore

      - name: Verify artifacts
        run: |
          test -f mod/bin/Release/RemotePlayEnhanced.dll
          test -f mod/bin/Release/0Harmony.dll
          test -f mod/bootstrap/bin/Release/Bootstrap.dll
          test -f loader/winhttp.dll
          test -f loader/doorstop_config.ini

      - name: Assemble standalone bundle
        run: |
          mkdir -p dist/bundle/RemotePlayEnhanced
          cp loader/winhttp.dll loader/doorstop_config.ini dist/bundle/
          cp mod/bin/Release/RemotePlayEnhanced.dll \
             mod/bin/Release/0Harmony.dll \
             dist/bundle/RemotePlayEnhanced/
          cp mod/bootstrap/bin/Release/Bootstrap.dll \
             dist/bundle/RemotePlayEnhanced/
          cp mod/README.md dist/bundle/RemotePlayEnhanced/README.md
          cp loader/LICENSE-Doorstop.txt dist/bundle/RemotePlayEnhanced/LICENSE-Doorstop.txt
          cp loader/LICENSE-Harmony.txt dist/bundle/RemotePlayEnhanced/LICENSE-Harmony.txt
          cd dist/bundle
          zip -r ../RemotePlayEnhanced.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePlayEnhanced-bundle
          path: dist/bundle
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePlayEnhanced-package
          path: dist/RemotePlayEnhanced.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mod-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RemotePlayEnhanced-package
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#mod-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/RemotePlayEnhanced.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/RemotePlayEnhanced.zip \
              --title "Remote Play Enhanced v${VERSION}" \
              --notes "Standalone Doorstop mod. No BepInEx required. Extract the zip into the Cult of the Lamb folder."
          fi
